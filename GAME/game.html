<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">

        <!--makes the game fit different screen sizes-->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!--sets the browser tab title -->
        <title>The Silent House - Game</title>

        <!--Connects the game to its CSS FILE-->
        <link rel="stylesheet" href="game.css">
    </head>
    <body>
        <!--this is where our phaser game will appear-->
        <div id="game-container"></div>

        <!--Loads the Phaser game engine-->
        <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>

        <!--Loads our external JS file-->
        <script src="game.js"></script>

    </body>

</html>
