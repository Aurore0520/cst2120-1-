<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">

        <!--Links the external CSS file for styling-->
        <link rel="stylesheet" href="style.css"> 


        <title>The Silent House</title>
    </head>
    <body>

      <div class="container"> <!--Main container for the whole page-->
        <!-- Button that redirects to the login page -->
        <a href="LoginOrRegister page.html"> 
        <button class="login-button">LOGIN</button> <!--Login button at the top right of the page-->
        </a>

        <!--Adding a button so that the player can mute the music-->
        <button id="soundToggle"> Music on or off</button>
        

       <div class="top-section"> <!--Top-section containing image and intro text-->
         <img src="Pictures, GIF, and sound/Logo.png" alt="The Silent House"> <!--Displays the Game logo-->

        <div class="text"> <!--Container for title and description-->
           <h1>The Silent House</h1>
           <hr> <!--Horizontal line seperator-->


        <div class="game buttons"> <!--game navigation buttons-->
            <!--button to start the game-->
            <button class="start-button" id="startButton">
                START GAME
            </button> 

            <!--button for the instructions-->
            <button class="how-to-play-button" id="howToPlayButton">
                HOW TO PLAY
            </button>

            <!--Displays the welcome message-->
            <p id="message"></p>
        </div>
        </div>
       </div>
       
      </div>
       <script src="JS/Script.js"></script>
    </body>
</html>
