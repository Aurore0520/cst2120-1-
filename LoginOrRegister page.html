<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewpoirt" content="width=device-width, initial-scale=1.0">

        <!--Tile-->
        <title>Login/Register - The Silent House</title>

        <!--Connects the page to an existing css file-->
        <link rel="stylesheet" href="CSS/RegisterOrLogin.css">
    </head>

    <body>
        <!--Main container for the login and registration forms-->
        <div class="container">

            <!--Registration section-->
            <div class ="auth-card">
              
                <h2>Register for The Silent House</h2>

                <form id="registerForm">
                  <!--Username input-->
                  <label for="registerUsername">Username:</label>
                  <input type="text" id="registerUsername" required>

                  <!--Password input-->
                  <label for="registerPassword">Password:</label>
                  <input type="password" id="registerPassword" required>

                  <!--Button to submit register details-->
                  <button type="submit">Register</button>

                </form>

                <!--Displays messages from Javascript-->
                <p id="registerMessage"></p>
            </div>

            <!--Registration section-->
            <div class ="auth-card">


               <!--login section for existing users-->
               <h2>Log in to The Silent House</h2>

               <form id="loginForm">
                  <!--Username input-->
                  <label for="loginUsername">Username:</label>
                  <input type="text" id="loginUsername" required>

                  <!--Password input-->
                  <label for="loginPassword">Password:</label>
                  <input type="password" id="loginPassword" required>

                  <!--Button to submit login details-->
                  <button type="submit">Login</button>

                </form>

                <!--Displays messages from Javascript-->
                <p id="loginMessage"></p>

            </div>    

            <!--Link to return to the main page-->
            <a href="index.html">Back to Home</a>

        </div>

        <!--Linking the page to JS file-->
        <script src="JS/LoginOrRegister page.js"></script>
    </body>
</html>
