<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">

        <!--Makes the page responsive on different screens-->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!--Links the external CSS file for styling-->
        <link rel="stylesheet" href="CSS/style.css"> 

        <title>Leaderboard- The Silent House</title>
    </head>
    <body class="ranking-page">
        <!--Main leaderboard for the whole page-->
        <div class="container">
            <nav classs="navbar">

            
                <!--Naviagtion links-->
                <div class="nav-links">
                    <a href="index.html">HOME</a>
                    <a href="LoginOrRegister page.html">LOGIN</a>
                </div>
            </nav>

            <h2>Leaderboard</h2>

            <!--Displays the current player's score-->
            <p id="currentScore">Your score: 0</p>

            <!--Table showing player rankings-->
            <table>

                <!--table headings-->
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Username</th>
                        <th>Score</th>
                    </tr>
                </thead>

                <!--JS inserts the ranking rows here-->
                <tbody id="rankingTable"></tbody>
            </table>

        </div>

        <!--Links the external JavaScript file-->
        <script src="JS/ranking.js"></script> 

    </body>
</html>
